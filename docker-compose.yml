version: '3.3'

services:
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - ADMIN_SERVICE_HOST=admin-service
      - ADMIN_SERVICE_PORT=3002
      - ASSET_SERVICE_HOST=asset-service
      - ASSET_SERVICE_PORT=3003
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3004
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - admin-service
      - asset-service
      - payment-service

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules

  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules

  asset-service:
    build:
      context: .
      dockerfile: apps/asset-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules

networks:
  default:
    driver: bridge
